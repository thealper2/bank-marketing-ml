name: Feature / task
description: New functionality, experiment or refactoring
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is missing and why does it matter ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Files, functions or commands that will change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable checklist. Each item must be testable.
      value: |
        - [ ] ...
        - [ ] `make check` passes
    validations:
      required: true